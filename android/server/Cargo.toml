[package]
name = "guandan_server"
version = "1.10.2"
edition = "2021"
description = "Guandan table server for the Android app (same web UI and protocol as the Python server)"
license = "MIT"

[lib]
name = "guandan_server"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "guandan-server"
path = "src/bin/guandan-server.rs"

[dependencies]
guandan_core = { package = "guandan_core", path = "../..", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
half = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
include_dir = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
