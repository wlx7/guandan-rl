[package]
name = "guandan_core"
version = "1.5.0"
edition = "2021"
description = "High performance Guandan rules engine for reinforcement learning"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py39"], optional = true }

[features]
default = ["python"]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
