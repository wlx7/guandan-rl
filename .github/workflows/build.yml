name: build

on:
  push:
    branches: [main, release]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --no-default-features

  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x64
          - os: ubuntu-latest
            target: x86_64
          - os: macos-15
            target: aarch64
          - os: macos-15
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Smoke test
        if: ${{ !(startsWith(matrix.os, 'macos') && matrix.target == 'x86_64') }}
        shell: bash
        run: |
          python -m pip install numpy fastapi "uvicorn[standard]" qrcode
          python -m pip install --no-deps dist/*.whl
          python -c "import guandan._core as c; g=c.Game(1); print(c.dims(), len(g.legal_moves()))"
          python -c "from guandan.evaluate import evaluate; print(evaluate('rule','random',rounds=200))" || true
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  portable:
    # one .exe that plays without installing anything (no PyTorch: numpy inference, no training)
    name: portable windows exe
    needs: [wheels]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-windows-latest-x64
          path: wheel
      - name: Build one-file exe
        shell: bash
        run: |
          python -m pip install numpy fastapi uvicorn websockets httptools qrcode pyinstaller
          python -m pip install --no-deps wheel/*.whl
          pyinstaller --noconfirm --onefile --console --name guandan_windows \
            --collect-all guandan --collect-submodules uvicorn --collect-submodules websockets \
            --hidden-import qrcode.image.svg --exclude-module torch --exclude-module tkinter \
            --distpath dist packaging/portable.py
          ls -la dist
      - name: Smoke test
        shell: bash
        run: |
          cd dist
          ./guandan_windows.exe --selftest
          (./guandan_windows.exe --no-browser > server.log 2>&1 &)
          cd ..
          python packaging/ci_smoke.py 8000 || (cat dist/server.log; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows
          path: dist/guandan_windows.exe

  android:
    # the Android app: Rust table server (android/server) in a WebView shell (android/app)
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Server on Linux (same code) plays a table
        run: |
          python -m pip install numpy websockets
          python packaging/export_gdm.py python/guandan/models/guandan-medium.pt guandan-medium.gdm
          cd android/server
          cargo build --release
          (./target/release/guandan-server --model ../../guandan-medium.gdm --home "$RUNNER_TEMP/h" --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &)
          cd ../..
          python packaging/ci_smoke.py 8000 || (cat "$RUNNER_TEMP/server.log"; exit 1)
      - name: Build the server library for Android
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cd android/server
          cargo ndk -t arm64-v8a -t x86_64 -P 24 -o ../app/src/main/jniLibs build --release --lib
          ls -la ../app/src/main/jniLibs/*
          mkdir -p ../app/src/main/assets
          cp ../../guandan-medium.gdm ../app/src/main/assets/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          cd android
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../guandan_android.apk
          ls -la ../guandan_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: guandan_android.apk

  android-test:
    # install the APK on an emulator, open it and play an AI table through its server
    name: android emulator test
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install websockets
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash packaging/android_emulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator
          path: emu/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    needs: [rust-tests, wheels, sdist, portable, android, android-test]
    # publish even if an optional platform (e.g. a queued macOS runner) did not finish
    if: always() && needs.rust-tests.result == 'success' && needs.sdist.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$V" == 0.* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect release assets
        run: |
          mkdir -p assets
          rm -f dist/*.png dist/*.txt  # emulator test screenshots and logs
          cp dist/* assets/
          cp scripts/install_windows.ps1 assets/ 2>/dev/null || true
          cp python/guandan/models/*.pt assets/ 2>/dev/null || true
          cp scripts/install_windows.bat scripts/start_windows.bat scripts/train_windows.bat assets/ 2>/dev/null || true
          cp scripts/install.sh scripts/cloud_train.sh assets/ 2>/dev/null || true
          ls -la assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 掼蛋 AI v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.ver.outputs.pre }}
          make_latest: true
          files: assets/*
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: false
